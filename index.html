<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3d epic</title>
  <meta name="description" content="Created with JMMM" />
  <meta name="theme-color" content="#05070a" />
  <link rel="icon" href="icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app">
    <video id="video" autoplay playsinline muted></video>
    <div class="vignette"></div>

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <p class="brand-name">Hands</p>
          <p class="brand-sub">Tony-Stark</p>
        </div>
      </div>

      <div class="topbar-right">
        <div id="status-pill" class="pill" role="status" aria-live="polite">
          <span id="status">Cargando</span>
        </div>
        <button id="toggle-guide" class="ghost-btn" type="button" aria-controls="guide" aria-expanded="true" aria-label="Mostrar u ocultar la guía de gestos">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="4" width="18" height="16" rx="3" />
            <path d="M3 14h18" />
          </svg>
          <span id="toggle-guide-label">Ocultar guía</span>
        </button>
      </div>
    </header>

    <section id="guide" class="guide" aria-label="Guía de gestos">
      <div class="guide-head">
        <h2>Gestos</h2>
        <p>Mantén las manos dentro del encuadre y con buena iluminación</p>
      </div>
      <div id="guide-strip" class="guide-strip"></div>
    </section>

    <!-- Carga inicial, permiso de camara y errores -->
    <div id="overlay" class="overlay" data-state="loading">
      <div class="overlay-card">
        <div class="overlay-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h7A2.5 2.5 0 0 1 16 8.5v7a2.5 2.5 0 0 1-2.5 2.5h-7A2.5 2.5 0 0 1 4 15.5z" />
            <path d="m16 10.5 4-2.5v8l-4-2.5" />
          </svg>
        </div>
        <h1 id="overlay-title">Cargando</h1>
        <p id="overlay-hint"></p>
        <button id="overlay-btn" class="primary-btn" type="button" hidden></button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" integrity="sha512-dLxUelApnYxpLt6K2iomGngnHO83iUvZytA3YjDUCjT0HDOHKXnVYdf3hU4JjM8uEhxf9nD1/ey98U3t2vZ0qQ==" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" integrity="sha384-oHwoZ9HyKv5ark5VOH+XWdbNfmhYtptAOBuV8plz6mAfXvTA6d8fULuYllWouEK2" crossorigin="anonymous"></script>
  <script src="js/app.js"></script>
</body>
</html>
